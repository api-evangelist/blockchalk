name: BlockChalk data model
status: retired
summary: >-
  BlockChalk exposed a single public entity: the chalk, a short message pinned to a
  geographic point. The published read interfaces returned a flat feed of chalks with no
  nested or referenced sub-resources, so the entity graph is intentionally shallow.
entities:
  - name: Chalk
    description: A short public message pinned to a latitude/longitude, authored anonymously.
    identifier:
      field: guid
      format: >-
        Permalink URL whose final path segment is a 12-character lowercase hexadecimal
        identifier, e.g. http://blockchalk.com/d7788df3e7b8
      id_prefix: null
    fields:
      - name: title
        type: string
        description: The chalk body text as posted.
      - name: link
        type: uri
        description: Permalink to the chalk on blockchalk.com.
      - name: guid
        type: uri
        description: Unique identifier; observed identical to link.
      - name: pubDate
        type: string
        description: RFC 1123 timestamp of when the chalk was posted.
      - name: description
        type: string
        description: Human-readable proximity or neighborhood label relative to the query point.
      - name: georss:point
        type: string
        description: Space-separated latitude and longitude of the chalk.
    relationships: []
  - name: Location
    description: >-
      An implicit query-time entity rather than a stored resource. The caller supplies a
      latitude/longitude and the service resolves it to a proximity band and, where known, a
      named neighborhood that it echoes back in each chalk's description.
    identifier:
