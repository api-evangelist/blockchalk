name: BlockChalk API lifecycle
status: retired
summary: >-
  BlockChalk was a location-based neighborhood messaging service launched in 2009 and funded
  in 2010. Its public read APIs are retired along with the product. The blockchalk.com domain
  registration is still active (registrar ERANET INTERNATIONAL LIMITED, expires 2028-07-20)
  but the delegated nameservers ns1/ns2.blockchalk.com do not resolve, so no BlockChalk host
  answers on the public internet.
