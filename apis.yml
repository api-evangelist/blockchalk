name: BlockChalk
description: >-
  BlockChalk was a location-based neighborhood messaging service founded in 2009 by Stephen
  Hood, the former product lead for Delicious, and Dave Baggeroer of the Stanford Institute of
  Design. Users with GPS-enabled smartphones left short public messages called "chalks" pinned
  to a specific geographic point, and read the chalks other people had left on their block, so
  neighbors could ask, answer, praise, gripe, report potholes and lost pets, announce garage
  sales and organize locally. The company raised $1M in seed financing in May 2010 from Joshua
  Schachter, Battery Ventures, Founder Collective, Harrison Metal, Mitch Kapor, Josh Stylman,
  Tom McInerney and David Liu. BlockChalk published a small read-only public API on its
  developer page, offering XML, JSON and RSS interfaces that returned nearby chalks for a
  supplied latitude and longitude, later joined by a versioned GeoRSS endpoint. The product
  and the company are retired: blockchalk.com holds an active domain registration but its
  delegated nameservers no longer resolve, and no BlockChalk host answers on the public
  internet. This profile preserves the historical API surface as documentation.
